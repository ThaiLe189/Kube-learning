apiVersion: v1 # Descriptor conforms to version v1 of Kubernetes API
kind: pod # Select Pod resource
metadata:
  name: kube-learning-pod # The name of the pod
spec:
  containers:
    - name: kube-learning-container # The name of the container
      image: kube/kube-learning:latest # Image to create the container
      imagePullPolicy: Never  # Prevents Kubernetes from pulling the image from a registry
      ports:
        - containerPort: 8000 # The port the app is listening on 
          protocol: TCP
